<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalable Image Upload</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #1e1b4b, var(--bg-color), #020617);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h2 {
            margin-top: 0;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* Custom File Input Upload Area */
        .upload-area {
            position: relative;
            width: 100%;
            height: 180px;
            border: 2px dashed rgba(99, 102, 241, 0.5);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(99, 102, 241, 0.05);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .upload-area input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 12px;
            color: #818cf8;
        }

        .upload-text {
            font-weight: 500;
            color: var(--text-muted);
        }

        .upload-subtext {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        /* Image Preview Setup */
        #preview-container {
            display: none;
            width: 100%;
            height: 180px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button.upload-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        button.upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        button.upload-btn:active {
            transform: translateY(0);
        }
        
        button.upload-btn:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: translateY(0);
        }

        /* Result Area */
        .result-box {
            display: none;
            margin-top: 24px;
            padding: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box span {
            display: block;
            color: #10b981;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-box a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
            word-break: break-all;
            transition: color 0.2s;
        }
        
        .result-box a:hover {
            color: #bae6fd;
            text-decoration: underline;
        }
        
        /* Spinner */
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Secure Cloud Upload</h2>
        <p class="subtitle">Directly stream your photos into AWS S3</p>

        <div class="upload-area" id="drop-zone">
            <input type="file" id="file" accept="image/jpeg, image/png">
            <div id="drop-content">
                <div class="upload-icon">☁️</div>
                <div class="upload-text">Drag & Drop or Click</div>
                <div class="upload-subtext">Supports JPG and PNG up to 2MB</div>
            </div>
            <img id="preview-container" alt="Image preview">
        </div>

        <button class="upload-btn" onclick="upload()" id="uploadBtn">
            <span id="btn-text">Upload to S3 Bucket</span>
            <div class="loader" id="loader"></div>
        </button>

        <div class="result-box" id="result">
            <span>✅ Upload Successful!</span>
            <a id="result-link" href="#" target="_blank">View Image</a>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file');
        const previewContainer = document.getElementById('preview-container');
        const dropContent = document.getElementById('drop-content');
        const uploadBtn = document.getElementById('uploadBtn');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');
        const resultLink = document.getElementById('result-link');

        // File Selection & Preview Logic
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.addEventListener("load", function() {
                    previewContainer.setAttribute("src", this.result);
                    previewContainer.style.display = "block";
                    dropContent.style.display = "none";
                });
                reader.readAsDataURL(file);
                // Reset result box if a new file is picked
                result.style.display = "none";
            }
        });

        // The Upload Function
        async function upload() {
            const file = fileInput.files[0];
            
            if (!file) {
                alert("Please select an image first!");
                return;
            }

            // UI Loading State Transition
            uploadBtn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';
            result.style.display = "none";

            const formData = new FormData();
            formData.append('image', file);

            try {
                // Notice: Utilizing a relative fetch path so it strictly binds to local instance ports
                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || 'Server error occurred');
                }

                // Render Success
                resultLink.href = data.url;
                resultLink.innerText = data.url;
                result.style.display = "block";
                
            } catch (err) {
                alert("Upload failed: " + err.message);
            } finally {
                // UI Reset Transition
                uploadBtn.disabled = false;
                btnText.style.display = 'block';
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
