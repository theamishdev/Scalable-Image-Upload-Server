name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run app (test run)
        run: |
          node server.js > server.log 2>&1 &
          sleep 3
          if curl -fsS http://localhost:3001 >/dev/null 2>&1; then
            echo "health check passed"
          else
            echo "health check failed — printing server logs for debugging"
            cat server.log || true
          fi
